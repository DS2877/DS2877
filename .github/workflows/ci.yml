name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_audio:
        description: >-
          Also upload assets/audio to Roblox. OFF by default: Roblox allows only
          10 audio uploads per month on an account that is not ID-verified, this
          project has 8 files, and audio cannot be updated in place -- so an
          upload that rides along with an unrelated CI run can burn a month's
          quota by accident.
        type: boolean
        default: false
      audio_file:
        description: >-
          With upload_audio on, upload only THIS file instead of all eight, e.g.
          assets/audio/sfx-deny.ogg. Run one small file first: it proves the API
          key, the creator id and the multipart format for the cost of a single
          slot. upload-audio.yml has the same option but cannot be dispatched
          until it reaches the default branch, which is why this lives here too.
        type: string
        default: ""

# A second push cancels the first: no point spending minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ROJO_VERSION: "7.7.0"
  SELENE_VERSION: "0.31.0"
  STYLUA_VERSION: "2.5.2"
  LUNE_VERSION: "0.10.5"
  LUAU_LSP_VERSION: "1.69.0"

jobs:
  check:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Swatinem/rust-cache caches build artifacts but not ~/.cargo/bin, so a
      # `cargo install` still relinks every run. Caching the binaries turns a
      # 7-10 minute toolchain step (measured, docs/DECISIONS.md D-014a) into
      # seconds. Keyed on the versions, so a bump rebuilds automatically.
      - name: Cache toolchain binaries
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: toolchain-bin-${{ runner.os }}-${{ env.ROJO_VERSION }}-${{ env.SELENE_VERSION }}-${{ env.STYLUA_VERSION }}-${{ env.LUNE_VERSION }}

      - name: Install toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Installed from crates.io so CI and cloud sessions build the exact
          # same versions from the same source. See docs/DECISIONS.md D-001.
          cargo install --locked stylua --version "$STYLUA_VERSION" --features luau
          cargo install --locked selene --version "$SELENE_VERSION"
          cargo install --locked lune   --version "$LUNE_VERSION"
          cargo install --locked rojo   --version "$ROJO_VERSION"

      - name: Confirm the toolchain is present
        run: |
          set -euo pipefail
          # Naming the syntax is the guard: a stylua built without the luau
          # feature rejects this flag outright instead of silently checking
          # zero files.
          stylua --syntax Luau --version
          selene --version
          lune --version
          rojo --version

      - name: Format check
        run: stylua --syntax Luau --check src tests

      - name: Lint
        run: selene src tests

      - name: Unit tests
        run: lune run tests/unit/run

      - name: Economy parity (Economy.luau vs the simulator)
        run: python3 tests/parity/economy_parity.py

      - name: Kid-safe content
        run: python3 tools/validate-kid-safe.py

      - name: Catalog validation
        run: python3 tools/validate-catalog.py

      - name: Economy simulator still hits its pacing targets
        run: |
          set -euo pipefail
          cd tools/simulate-economy
          python3 simulate.py --trials 10 | tee /tmp/sim.txt
          if grep -q "FAIL" /tmp/sim.txt; then
            echo "::error::The economy no longer hits the pacing targets in docs/ECONOMY.md"
            exit 1
          fi

      - name: Build place
        run: |
          mkdir -p build
          rojo build default.project.json --output build/nomling.rbxl
          ls -lh build/nomling.rbxl

      - uses: actions/upload-artifact@v4
        with:
          name: place
          path: build/nomling.rbxl
          retention-days: 7

  typecheck:
    name: Typecheck (luau-lsp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE JOB THAT SHOULD HAVE EXISTED ALL ALONG. Every file in src/ opens
      # with --!strict and, until this landed, nothing ever read it. A function
      # that wanted a BasePart was handed a number for four commits; it threw on
      # the first base, no player on any server was ever assigned one, and
      # format, lint, 142 unit tests, parity, the kid-safe gate and the Rojo
      # build were all green over it. docs/DECISIONS.md D-014 (corrected), D-023.
      #
      # This is the one check that cannot also run in a cloud session: luau-lsp
      # is a C++ project with no crates.io package, and the sandbox's egress
      # proxy blocks GitHub release downloads. A runner has neither problem.
      # RESTORE-ONLY, and sharing the CHECK JOB'S key rather than owning one.
      # A cache this job wrote would only ever be saved on a run where the
      # analyzer passed, because actions/cache skips its post step when the job
      # fails -- so every red run would rebuild Rojo from source on the next
      # attempt, which is the slowest possible moment to spend two and a half
      # minutes. The check job's cache is written whenever formatting and tests
      # pass, which is almost always, and it already contains this exact Rojo.
      - name: Restore the toolchain cache (for rojo)
        id: analyze-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin
          key: toolchain-bin-${{ runner.os }}-${{ env.ROJO_VERSION }}-${{ env.SELENE_VERSION }}-${{ env.STYLUA_VERSION }}-${{ env.LUNE_VERSION }}

      # Not cached: it is a 3 MB download that takes about a second, and a cache
      # entry for it would cost more to manage than it saves.
      - name: Install luau-lsp
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau-lsp.zip \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/${LUAU_LSP_VERSION}/luau-lsp-linux-x86_64.zip"
          unzip -o -j /tmp/luau-lsp.zip luau-lsp -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau-lsp"

      - name: Install Rojo
        if: steps.analyze-cache.outputs.cache-hit != 'true'
        run: cargo install --locked rojo --version "$ROJO_VERSION"

      - name: Confirm the analyzer is present
        run: |
          set -euo pipefail
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/luau-lsp" --version
          rojo --version

      # Roblox's own API surface, as Luau types. Without it every Instance,
      # every service and every Enum is `any` -- which would quietly pass the
      # exact class of mistake this job exists to catch.
      - name: Fetch Roblox type definitions
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/globalTypes.d.luau \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau"
          wc -l /tmp/globalTypes.d.luau

      # Roblox resolves a require through the DataModel tree (script.Parent),
      # not the filesystem. The sourcemap is how the analyzer learns which file
      # is which instance; without it every cross-module require is `any`.
      - name: Sourcemap
        run: rojo sourcemap default.project.json --output /tmp/sourcemap.json

      - name: Analyze
        run: |
          set -euo pipefail
          luau-lsp analyze \
            --sourcemap=/tmp/sourcemap.json \
            --definitions=/tmp/globalTypes.d.luau \
            --base-luaurc=.luaurc \
            --settings=.github/luau-lsp-settings.json \
            --ignore="**/Packages/**" \
            src

  publish-test:
    name: Publish to TEST (LIVE)
    needs: check
    runs-on: ubuntu-latest
    # Also runs on manual dispatch, not just pull_request. Without that there
    # was no way to exercise the publish path on demand -- the first real
    # attempt could only happen inside a PR, which is a poor place to discover
    # that Roblox is returning 409.
    #
    # Skips cleanly when the secrets are absent, so early PRs still go green on
    # everything that can run.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: place
          path: build

      - name: Check credentials are present
        id: creds
        # Read through env rather than interpolating `${{ }}` straight into the
        # shell. Direct interpolation builds the secret into the command line,
        # which both risks it surfacing in a log and makes an unset value
        # indistinguishable from a quoting mistake. This also reports WHICH
        # piece is missing, so a skip is diagnosable instead of ambiguous.
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: |
          missing=""
          [ -z "${API_KEY:-}" ] && missing="$missing ROBLOX_API_KEY(secret)"
          [ -z "${UNIVERSE_ID:-}" ] && missing="$missing ROBLOX_TEST_UNIVERSE_ID(variable)"
          [ -z "${PLACE_ID:-}" ] && missing="$missing ROBLOX_TEST_PLACE_ID(variable)"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Credentials present. Universe $UNIVERSE_ID, place $PLACE_ID."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping TEST publish. Missing:$missing"
            echo "::warning::Secrets live under Settings > Secrets and variables > Actions > Secrets. Variables are the separate Variables tab on the same page -- putting an ID in the Secrets tab is the usual cause."
          fi

      # PUBLISHED, NOT SAVED, AND THIS IS THE WHOLE POINT OF THE JOB.
      #
      # This step used to pass --type Saved, which uploads a version and does
      # NOT make it the one players get. publish.py says so in its own output.
      # The result: two days of work, every CI run green, every run reporting
      # "Publish to TEST: success" -- and Philip playing a build from before
      # any of it, sending back screenshots of bugs that had already been
      # fixed. Three rounds were spent debugging code that was never running.
      #
      # The original reasoning was that a PR should exercise the publish path
      # without changing what players get. That is right for a team with a
      # shared test environment. Here there is one developer, one branch, and
      # one phone, and "what players get" IS the thing being tested. A publish
      # nobody can open is not a test, it is a green tick that means nothing.
      #
      # PROD is untouched by this and still needs Philip's explicit OK
      # (CLAUDE.md, never-without-asking rule 1); deploy-prod.yml is the only
      # thing that can reach it.
      - name: Publish LIVE to TEST
        id: publish
        if: steps.creds.outputs.ready == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: python3 tools/publish.py --env test --type Published --file build/nomling.rbxl

      - name: Cloud smoke test
        if: steps.creds.outputs.ready == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: |
          # One task, many assertions: task creation is capped at 5/minute per
          # API key owner, so never split this into a task per test.
          python3 tools/run-cloud-tests.py --env test --version "${{ steps.publish.outputs.version }}"

      # An asset id in the config says nothing about whether Roblox will PLAY
      # it. Audio uploaded through Open Cloud goes through moderation, and until
      # it clears, a Sound with a perfectly valid SoundId is silent and raises
      # nothing. A playtester reported exactly that silence with all eight ids
      # present and correct, so this asks Roblox what it thinks of them.
      #
      # continue-on-error: this is a REPORT, not a gate. Moderation being slow
      # is not a reason to fail a build, and a red CI that means "wait a bit"
      # is a red CI people learn to ignore.
      - name: Audio moderation status
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 tools/check-audio.py

  upload-audio:
    name: Upload the theme to Roblox (manual only)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_audio }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        id: upload
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: "7185134469"
        run: |
          if [ -n "${{ inputs.audio_file }}" ]; then
            python3 tools/upload-audio.py --file "${{ inputs.audio_file }}" \
              --name "Fuse a Nomling audio"
          else
            python3 tools/upload-audio.py --all assets/audio
          fi
      - name: Report
        run: |
          {
            echo "### Theme upload"
            if [ -n "${{ steps.upload.outputs.uploaded }}${{ steps.upload.outputs.asset_id }}" ]; then
              echo '```'
              echo "${{ steps.upload.outputs.uploaded }}${{ steps.upload.outputs.asset_id }}"
              echo '```'
            else
              echo "Nothing uploaded - see the log (most likely the key lacks the \`asset\` scope)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
