name: Upload audio to Roblox

# Manual only. Uploading creates assets on Philip's Roblox account and sends
# them through moderation, so it is never automatic.
on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Directory of .ogg files to upload"
        default: "assets/audio"
        required: true

jobs:
  upload:
    name: Upload and report the asset ID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload
        id: upload
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_USER_ID: ${{ vars.ROBLOX_USER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ROBLOX_USER_ID:-}" ]; then
            echo "ROBLOX_USER_ID variable is not set; falling back to the known creator id"
            export ROBLOX_USER_ID=7185134469
          fi
          python3 tools/upload-audio.py --all "${{ inputs.directory }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Audio upload"
            echo ""
            echo '```'
            echo "${{ steps.upload.outputs.uploaded }}"
            echo '```'
            echo ""
            echo "Put these in \`src/shared/Config/Audio.luau\`."
          } >> "$GITHUB_STEP_SUMMARY"
