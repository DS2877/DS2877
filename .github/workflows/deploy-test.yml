name: Deploy TEST

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  ROJO_VERSION: "7.7.0"

jobs:
  deploy:
    name: Publish TEST so Philip can play it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building Rojo from source costs minutes on every deploy. Cache the
      # binary so a re-run after a failed publish is fast -- which matters,
      # because re-running after a failed publish is the whole workflow.
      - name: Cache Rojo binary
        id: rojo-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/rojo
          key: rojo-bin-${{ runner.os }}-${{ env.ROJO_VERSION }}

      - uses: Swatinem/rust-cache@v2
        if: steps.rojo-cache.outputs.cache-hit != 'true'

      - name: Install Rojo
        if: steps.rojo-cache.outputs.cache-hit != 'true'
        run: cargo install --locked rojo --version "$ROJO_VERSION"

      - name: Confirm Rojo is present
        run: rojo --version

      - name: Build
        run: |
          mkdir -p build
          rojo build default.project.json --output build/nomling.rbxl

      - name: Publish as Published
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_TEST_UNIVERSE_ID: ${{ vars.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_TEST_PLACE_ID: ${{ vars.ROBLOX_TEST_PLACE_ID }}
        run: python3 tools/publish.py --env test --type Published --file build/nomling.rbxl

      - name: Summary
        run: |
          {
            echo "### TEST updated"
            echo ""
            echo "Open the TEST place on your phone to play the latest main."
          } >> "$GITHUB_STEP_SUMMARY"
